<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineAnchieta</title>
    <link rel="stylesheet" href="./css/cineanchieta.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div class="cabecalho__conteudo">
        <div class="cabecalho__topo">
          <p class="cabecalho__eyebrow">Sua estante de filmes e séries</p>
          <!-- Aula 5: nome de quem entrou e botão para sair -->
          <div class="cabecalho__acoes" id="acoes-usuario" hidden>
            <span class="cabecalho__usuario" id="usuario-nome"></span>
            <button class="botao botao--pequeno botao--neutro" id="botao-sair" type="button">
              Sair
            </button>
          </div>
        </div>
        <h1 class="cabecalho__titulo"><span id="nome-do-sistema">—</span></h1>
        <p class="cabecalho__subtitulo">
          <span id="versao">—</span> · <span id="data-de-hoje">—</span>
        </p>
      </div>
    </header>

    <!-- Aula 5: a página abre na entrada; o sistema só aparece depois do login -->
    <section class="entrada" id="tela-entrada" aria-label="Entrar no CineAnchieta">
      <form class="formulario" id="form-entrar">
        <h2>Entrar</h2>
        <div class="campo">
          <label class="campo__rotulo" for="entrar-email">E-mail</label>
          <input
            class="campo__entrada"
            id="entrar-email"
            type="email"
            autocomplete="username"
            maxlength="150"
            required
          />
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="entrar-senha">Senha</label>
          <input
            class="campo__entrada"
            id="entrar-senha"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="botao botao--primario" type="submit">Entrar</button>
      </form>

      <form class="formulario" id="form-criar" hidden>
        <h2>Criar conta</h2>
        <div class="campo">
          <label class="campo__rotulo" for="criar-nome">Nome</label>
          <input
            class="campo__entrada"
            id="criar-nome"
            type="text"
            autocomplete="name"
            maxlength="100"
            required
          />
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="criar-email">E-mail</label>
          <input
            class="campo__entrada"
            id="criar-email"
            type="email"
            autocomplete="email"
            maxlength="150"
            required
          />
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="criar-senha">Senha (6 caracteres ou mais)</label>
          <input
            class="campo__entrada"
            id="criar-senha"
            type="password"
            autocomplete="new-password"
            minlength="6"
            maxlength="72"
            required
          />
        </div>
        <button class="botao botao--primario" type="submit">Criar conta</button>
      </form>

      <button class="botao botao--pequeno botao--neutro entrada__alternar" id="alternar-entrada" type="button">
        Ainda não tenho conta
      </button>
      <p class="campo__erro" id="erro-entrada" role="alert"></p>
    </section>

    <!-- Todo o resto da página (painel, formulário e lista) fica aqui dentro -->
    <main class="conteudo" id="tela-app" hidden>
      <section class="painel" aria-label="Resumo da lista">
        <div class="estatistica">
          <span class="estatistica__numero" id="total">0</span>
          <span class="estatistica__rotulo">títulos</span>
        </div>
        <div class="estatistica">
          <span class="estatistica__numero" id="quero-ver">0</span>
          <span class="estatistica__rotulo">quero ver</span>
        </div>
        <div class="estatistica">
          <span class="estatistica__numero" id="assistindo">0</span>
          <span class="estatistica__rotulo">assistindo</span>
        </div>
        <div class="estatistica">
          <span class="estatistica__numero" id="assisti">0</span>
          <span class="estatistica__rotulo">assistidos</span>
        </div>
      </section>

      <form class="formulario" id="formulario">
        <div class="campo">
          <label class="campo__rotulo" for="titulo">Título</label>
          <input
            class="campo__entrada"
            id="titulo"
            type="text"
            maxlength="120"
            autocomplete="off"
            placeholder="Ex.: Interestelar"
            aria-describedby="erro"
          />
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="formato">Formato</label>
          <select class="campo__selecao" id="formato">
            <option value="filme" selected>Filme</option>
            <option value="serie">Série</option>
          </select>
        </div>
        <!-- Ouro: data opcional; o destaque "Em breve" aparece na lista -->
        <div class="campo">
          <label class="campo__rotulo" for="lancamento">Lançamento (opcional)</label>
          <input class="campo__entrada" id="lancamento" type="date" />
        </div>
        <button class="botao botao--primario" type="submit">Cadastrar</button>
      </form>

      <p class="campo__erro" id="erro" role="alert"></p>

      <!-- Ouro: aviso visível quando a API está fora do ar -->
      <p class="aviso aviso--erro" id="aviso-api" role="alert" hidden></p>

      <!-- aviso escondido (hidden): o find é quem o mostra -->
      <p class="aviso" id="comece-por" hidden></p>

      <!-- a lista começa vazia: quem a preenche é a API -->
      <ul class="lista" id="lista"></ul>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
